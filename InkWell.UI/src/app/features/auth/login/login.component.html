<div class="login-page">
  <div class="login-card fade-in">
    <div class="card-header">
      <div class="logo">InkWell<span>.</span></div>
      <h1>Welcome Back</h1>
      <p>Enter your details to access your account</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="alert alert-error" *ngIf="error">
        {{error}}
      </div>

      <!-- Email -->
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <lucide-icon [name]="Mail" class="input-icon"></lucide-icon>
          <input
            type="email"
            name="email"
            [(ngModel)]="credentials.email"
            placeholder="name@example.com"
            required
            email
            #email="ngModel">
        </div>
        <div class="field-error" *ngIf="email.invalid && email.touched">
          <span *ngIf="email.errors?.['required']">Email is required.</span>
          <span *ngIf="email.errors?.['email']">Please enter a valid email address.</span>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <div class="label-row">
          <label>Password</label>
          <a routerLink="/forgot-password" class="link-forgot">Forgot?</a>
        </div>
        <div class="input-wrapper">
          <lucide-icon [name]="Lock" class="input-icon"></lucide-icon>
          <input
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="credentials.password"
            placeholder="••••••••"
            required
            minlength="6"
            #password="ngModel">
          <button type="button" class="btn-toggle-pwd" (click)="showPassword = !showPassword">
            <lucide-icon [name]="showPassword ? EyeOff : Eye"></lucide-icon>
          </button>
        </div>
        <div class="field-error" *ngIf="password.invalid && password.touched">
          <span *ngIf="password.errors?.['required']">Password is required.</span>
          <span *ngIf="password.errors?.['minlength']">Password must be at least 6 characters.</span>
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading || loginForm.invalid">
        <lucide-icon [name]="Loader2" class="icon-spin" *ngIf="loading"></lucide-icon>
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading">Signing in...</span>
      </button>

    </form>

    <div class="card-footer">
      Don't have an account? <a routerLink="/register">Create one</a>
    </div>
  </div>
</div>
