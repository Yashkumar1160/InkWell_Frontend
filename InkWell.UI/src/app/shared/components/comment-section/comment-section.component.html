<section class="comment-section">
  <h3 class="section-title">Comments</h3>

  <!-- Add Comment Form -->
  <div class="comment-form-container" *ngIf="isLoggedIn; else loginToComment">
    <div class="form-group">
      <textarea 
        [(ngModel)]="newCommentContent" 
        placeholder="Write a comment..."
        class="comment-textarea"
        rows="3"
      ></textarea>
      <div class="form-actions">
        <button 
          class="btn-primary" 
          [disabled]="!newCommentContent.trim() || isSubmitting"
          (click)="submitComment()"
        >
          {{ isSubmitting ? 'Posting...' : 'Post Comment' }}
        </button>
      </div>
    </div>
  </div>

  <ng-template #loginToComment>
    <div class="login-prompt">
      <p><a routerLink="/login" class="login-link">Log in</a> to join the conversation.</p>
    </div>
  </ng-template>

  <!-- Comments List -->
  <div class="comments-list">
    <div *ngFor="let comment of comments" class="comment-item-wrapper">
      <ng-container *ngTemplateOutlet="commentTemplate; context: { $implicit: comment, depth: 0 }"></ng-container>
    </div>
  </div>

  <!-- Recursive Comment Template -->
  <ng-template #commentTemplate let-comment let-depth="depth">
    <div class="comment-item" [style.margin-left.px]="depth * 40">
      <div class="comment-header">
        <img [src]="authorMap[comment.authorId]?.avatarUrl || 'https://ui-avatars.com/api/?name=' + (authorMap[comment.authorId]?.fullName || 'User') + '&size=32&background=random'" alt="Avatar" class="avatar">
        <div class="comment-meta">
          <span class="author-name">{{ authorMap[comment.authorId]?.fullName || authorMap[comment.authorId]?.username || 'User #' + comment.authorId }}</span>
          <span class="comment-date">{{ comment.createdAt | timeAgo }}</span>
        </div>
        <button *ngIf="canDelete(comment)" class="delete-btn" (click)="deleteComment(comment)">
          <i class="fas fa-trash"></i>
        </button>
      </div>
      <div class="comment-content" *ngIf="editingCommentId !== comment.commentId">
        {{ comment.content }}
      </div>

      <!-- Inline Edit Form -->
      <div class="comment-edit-form" *ngIf="editingCommentId === comment.commentId">
        <textarea 
          [(ngModel)]="editContent" 
          class="comment-textarea"
          rows="3"
        ></textarea>
        <div class="form-actions">
          <button class="btn-cancel btn-sm" (click)="cancelEdit()">Cancel</button>
          <button 
            class="btn-primary btn-sm" 
            [disabled]="!editContent.trim()"
            (click)="saveEditComment(comment)"
          >
            Save Changes
          </button>
        </div>
      </div>

      <div class="comment-footer" *ngIf="editingCommentId !== comment.commentId">
        <button class="action-btn" [class.active]="likedComments.has(comment.commentId)" (click)="toggleLikeComment(comment)">
          <i [class]="likedComments.has(comment.commentId) ? 'fas fa-heart' : 'far fa-heart'"></i> {{ comment.likesCount }}
        </button>
        <button class="action-btn" (click)="toggleReply(comment)">
          <i class="far fa-comment"></i> Reply
        </button>
        <button *ngIf="canDelete(comment)" class="action-btn" (click)="startEditComment(comment)">
          <i class="far fa-edit"></i> Edit
        </button>
      </div>

      <!-- Reply Form -->
      <div *ngIf="replyingTo === comment.commentId" class="reply-form">
        <textarea 
          [(ngModel)]="replyContent" 
          [placeholder]="'Replying to ' + (authorMap[comment.authorId]?.fullName || 'User #' + comment.authorId) + '...'"
          class="comment-textarea"
          rows="2"
        ></textarea>
        <div class="form-actions">
          <button class="btn-cancel" (click)="replyingTo = null">Cancel</button>
          <button 
            class="btn-primary btn-sm" 
            [disabled]="!replyContent.trim() || isSubmitting"
            (click)="submitReply(comment)"
          >
            Post Reply
          </button>
        </div>
      </div>

      <!-- Replies Container -->
      <div class="replies-container" *ngIf="repliesMap[comment.commentId]">
        <div *ngFor="let reply of repliesMap[comment.commentId]" class="comment-item-wrapper">
          <ng-container *ngTemplateOutlet="commentTemplate; context: { $implicit: reply, depth: depth + 1 }"></ng-container>
        </div>
      </div>
    </div>
  </ng-template>
</section>
