<div class="post-card fade-in" [routerLink]="['/post', post.slug]">
  <div class="post-image">
    <img 
      [src]="post.featuredImageUrl || 'https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&q=80&w=600'" 
      alt="Post cover" 
      loading="lazy"
    >
    <div class="overlay"></div>
    <div class="category-badge">Technology</div>
  </div>
  <div class="post-body">
    <h3 class="title">{{post.title}}</h3>
    <span class="author-tag">by {{post.authorName || 'Anonymous'}}</span>
    <p class="excerpt">{{post.excerpt}}</p>
    
    <div class="post-footer">
      <div class="footer-left">
        <div class="read-time">
          <lucide-icon [name]="Clock" class="icon"></lucide-icon>
          {{post.readTimeMinutes}} min read
        </div>
      </div>
      <div class="footer-right">
        <div class="stat likes">
          <lucide-icon [name]="Heart" class="icon"></lucide-icon>
          {{post.likesCount}}
        </div>
        <div class="stat comments">
          <lucide-icon [name]="MessageCircle" class="icon"></lucide-icon>
          {{ commentCount }}
        </div>
      </div>
    </div>
  </div>
</div>
